<!doctype html>

<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11101a">
<title>Meet — Teman Ngobrol</title>

<style>
:root{
  color-scheme:dark;
  --bg:#0f0e16;
  --p:#191725;
  --p2:#211e30;
  --line:rgba(204,190,255,.14);
  --text:#f6f2ff;
  --muted:#aaa3bd;
  --purple:#9b82f5;
  --danger:#ff9ca8;
  --online:#76dfa9;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{
  background:radial-gradient(ellipse at top,#241b3d,#151322 40%,var(--bg) 75%);
  color:var(--text);
  font-family:Inter,system-ui,sans-serif;
  display:flex;
  justify-content:center;
  overflow:hidden;
}
button,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,textarea:focus-visible{
  outline:2px solid var(--purple);
  outline-offset:3px;
}
.app{
  width:100%;
  max-width:820px;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:rgba(15,14,22,.78);
  border-inline:1px solid #ffffff08;
}
.topbar{
  min-height:76px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
  background:#191725eb;
  z-index:5;
}
.brand-avatar,.welcome-avatar{
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#c2adff,#7657dc);
  box-shadow:0 7px 25px #7657dc40;
}
.brand-avatar{
  width:46px;height:46px;flex:0 0 46px;
  border-radius:16px;font-size:24px;
}
.brand-copy{flex:1;min-width:0}
.brand-copy h1{font-size:17px;margin:0 0 4px}
.status{
  display:flex;align-items:center;gap:6px;
  color:var(--muted);font-size:12px;
}
.status-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--online);
}
.top-action{
  width:39px;height:39px;border:1px solid var(--line);
  border-radius:13px;background:var(--p2);
  color:var(--text);font-size:20px;
}
.chat-area{
  flex:1;min-height:0;overflow-y:auto;
  overscroll-behavior:contain;padding:20px 15px;
}
.welcome{text-align:center;padding:30px 10px}
.welcome-avatar{
  width:78px;height:78px;margin:0 auto 16px;
  border-radius:27px;font-size:40px;
}
.welcome h2{font-size:23px;margin:0 0 8px}
.welcome p{
  max-width:340px;margin:auto;color:var(--muted);
  font-size:14px;line-height:1.6;
}
.suggestions{
  display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;margin-top:20px;
}
.suggestion{
  border:1px solid #af97ff38;border-radius:999px;
  background:#7657dc1a;color:#d9ceff;
  padding:9px 13px;font-size:12px;
}
.message-row{
  display:flex;align-items:flex-end;gap:8px;margin:15px 0;
}
.message-row.user{justify-content:flex-end}
.message-content{
  display:flex;flex-direction:column;
  max-width:min(86%,570px);min-width:0;
}
.mini-avatar{
  flex:0 0 30px;width:30px;height:30px;
  border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,#bba4ff,#7657dc);
}
.bubble{
  padding:11px 14px;font-size:14px;line-height:1.55;
  white-space:pre-wrap;overflow-wrap:anywhere;
  border-radius:17px 17px 17px 5px;
  background:var(--p2);border:1px solid var(--line);
}
.message-row.user .bubble{
  background:linear-gradient(145deg,#8265e7,#684bd0);
  border:0;border-radius:17px 17px 5px 17px;
}
.message-time{
  margin-top:4px;font-size:10px;color:#77718c;
  padding:0 4px;text-align:right;
}
.typing{display:inline-flex;gap:5px;padding:4px}
.typing span{
  width:6px;height:6px;border-radius:50%;
  background:#c4b2ff;animation:pulse 1s infinite;
}
@keyframes pulse{50%{opacity:.3;transform:translateY(-4px)}}
.error-note{
  color:var(--danger);font-size:11px;margin-top:7px;
  overflow-wrap:anywhere;
}
.answer-basis{
  margin-top:9px;border:1px solid var(--line);
  border-radius:13px;background:#171523;overflow:hidden;
}
.answer-basis summary{
  cursor:pointer;list-style:none;display:flex;
  align-items:center;gap:8px;padding:10px 12px;
  color:#d8ccff;font-size:12px;font-weight:600;
}
.answer-basis summary::-webkit-details-marker{display:none}
.answer-basis summary:after{
  content:"＋";margin-left:auto;color:var(--muted);
}
.answer-basis[open] summary:after{content:"−"}
.basis-body{
  padding:0 12px 12px;font-size:12px;
  line-height:1.6;color:var(--muted);
}
.basis-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;margin:3px 0 12px;
}
.basis-item{
  min-width:0;padding:9px;border:1px solid #ffffff0c;
  border-radius:10px;background:#ffffff04;
}
.basis-label{font-size:10px;color:#89839e;margin-bottom:3px}
.basis-value{color:var(--text);overflow-wrap:anywhere}
.basis-heading{font-size:11px;color:#d8ccff;font-weight:600;margin:12px 0 5px}
.basis-sources{margin:0;padding-left:18px}
.basis-sources li{margin:5px 0;overflow-wrap:anywhere}
.basis-sources a{color:#c4b2ff;text-underline-offset:2px}
.basis-note{font-size:10px;line-height:1.5;color:#817a97;margin-top:10px}
.composer-wrap{
  padding:10px 13px max(13px,env(safe-area-inset-bottom));
  background:#191725f7;border-top:1px solid var(--line);
}
.mode-chip-row{display:flex;gap:7px;flex-wrap:wrap;margin:0 2px 8px}
.mode-chip{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid #af97ff40;border-radius:999px;
  background:#7657dc21;color:#e0d6ff;
  padding:5px 9px;font-size:11px;
}
.mode-chip button,.file-chip button{
  border:0;background:transparent;color:var(--danger);font-size:17px;
}
.file-chip{
  display:flex;align-items:center;gap:8px;max-width:100%;
  border:1px solid var(--line);background:#191627;
  border-radius:12px;padding:8px 10px;font-size:12px;
  color:var(--muted);margin-bottom:7px;
}
.file-name{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;
}
.composer{
  display:flex;align-items:flex-end;gap:7px;padding:7px;
  background:var(--p2);border:1px solid var(--line);border-radius:20px;
}
#messageInput{
  flex:1;min-width:0;resize:none;max-height:140px;min-height:40px;
  padding:10px 8px;border:0;outline:0;color:var(--text);
  background:transparent;line-height:1.45;font-size:14px;
}
#messageInput::placeholder{color:#89839e}
.plus-wrap{position:relative;flex:0 0 42px}
#plusButton,#sendButton,#micButton{
  width:42px;height:42px;border-radius:14px;
  display:grid;place-items:center;flex:0 0 42px;
}
#plusButton{
  border:1px solid var(--line);background:#2a2540;
  color:#e9e1ff;font-size:26px;
}
#sendButton{
  border:0;color:white;
  background:linear-gradient(145deg,#aa91ff,#7657dc);font-size:22px;
}
#micButton{
  border:1px solid var(--line);background:#302846;
  color:#e9e1ff;font-size:19px;
}
#micButton.listening{
  background:#a83d62;border-color:#ff9ca8;
  animation:micPulse 1.2s infinite;
}
@keyframes micPulse{
  50%{box-shadow:0 0 0 5px #ff9ca822}
}
#voiceStatus{
  display:none;color:#d8ccff;font-size:11px;
  padding:7px 5px 0;line-height:1.5;
}
#voiceStatus.show{display:block}
.voice-controls{
  display:flex;gap:7px;flex-wrap:wrap;margin-top:7px;
}
.voice-control{
  padding:6px 10px;border-radius:999px;
  border:1px solid var(--line);background:#2a2540;
  color:#ded4ff;font-size:11px;
}
.speech-actions{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;
}
.speech-button{
  border:1px solid var(--line);border-radius:999px;
  background:#2a2540;color:#d8ccff;
  padding:5px 9px;font-size:11px;
}
#plusMenu{
  position:absolute;bottom:52px;left:0;
  width:min(290px,calc(100vw - 40px));max-height:70vh;
  overflow:auto;padding:7px;border:1px solid var(--line);
  border-radius:17px;background:#211e30;z-index:20;display:none;
}
#plusMenu.open{display:block}
.menu-title{padding:8px 10px;color:var(--muted);font-size:10px}
.menu-item{
  width:100%;display:flex;align-items:center;gap:11px;
  text-align:left;padding:11px 10px;border:0;
  border-radius:11px;background:transparent;color:var(--text);
}
.menu-item:hover,.menu-item[aria-pressed=true]{background:#7657dc2e}
.menu-icon{
  width:32px;height:32px;flex:0 0 32px;
  display:grid;place-items:center;border-radius:10px;
  background:#9b82f51f;
}
.menu-copy{display:flex;flex-direction:column;gap:3px}
.menu-copy strong{font-size:13px}
.menu-copy small{font-size:11px;color:var(--muted);line-height:1.4}
.file-hint{font-size:11px;color:var(--muted);padding:6px 4px 0;line-height:1.5}
.disclaimer{text-align:center;font-size:10px;color:#77718c;margin:8px 0 0}
#fileInput{display:none}
@media(max-width:430px){
  .topbar{min-height:70px;padding:10px 12px}
  .chat-area{padding:17px 12px}
  .welcome-avatar{width:70px;height:70px}
  .welcome h2{font-size:21px}
  .composer{gap:5px;padding:6px}
  #plusButton,#sendButton,#micButton{width:39px;height:39px;flex-basis:39px}
  .plus-wrap{flex-basis:39px}
}
@media(min-width:600px){
  .chat-area{padding:25px}
  .composer-wrap{padding-left:22px;padding-right:22px}
}
</style>

<script>
"use strict";

const API_URL="https://meet.kharishabibh.workers.dev/api/chat";
const IMAGE_API_URL="https://meet.kharishabibh.workers.dev/api/generate-image";
const HISTORY_KEY="meet_chat_history_v1";
const SESSION_KEY="meet_session_id_v1";
const MAX_FILE_SIZE=5*1024*1024;
const MAX_TEXT_LENGTH=12000;

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc=
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

function getSessionId(){
  let id=localStorage.getItem(SESSION_KEY);
  if(!id){
    id="meet_"+Date.now().toString(36)+"_"+
      (crypto.randomUUID?crypto.randomUUID().replace(/-/g,""):Math.random().toString(36).slice(2));
    localStorage.setItem(SESSION_KEY,id);
  }
  return id;
}

const sessionId=getSessionId();
const $=id=>document.getElementById(id);
const chatArea=$("chatArea");
const messagesElement=$("messages");
const welcomeElement=$("welcome");
const form=$("chatForm");
const input=$("messageInput");
const sendButton=$("sendButton");
const clearButton=$("clearButton");
const plusButton=$("plusButton");
const plusMenu=$("plusMenu");
const modeChipRow=$("modeChipRow");
const fileChipRow=$("fileChipRow");
const fileInput=$("fileInput");
const uploadButton=$("uploadButton");
const generateImageButton=document.querySelector('[data-mode="image"]');
const fileHint=$("fileHint");
const statusText=$("statusText");
const micButton=$("micButton");
const voiceStatus=$("voiceStatus");
const autoSpeakButton=$("autoSpeakButton");
const stopSpeechButton=$("stopSpeechButton");

let history=[];
let isSending=false;
let activeMode="";
let selectedFile=null;
let fileText="";
let fileIsImage=false;
let isReadingFile=false;
let generatedMediaUrls=[];
let autoSpeak=true;
let recognition=null;
let isListening=false;
let voiceBaseText="";
let lastSpokenText="";

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const speechSupported=!!SpeechRecognition;
const ttsSupported=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);

const modeInfo={
  auto:{label:"Otomatis",icon:"✨"},
  short:{label:"Jawaban singkat",icon:"⚡"},
  think:{label:"Berpikir",icon:"🧠"},
  search:{label:"Browsing",icon:"🔎"},
  think_search:{label:"Berpikir + Browsing",icon:"🧠🔎"},
  memory:{label:"Memori",icon:"🧠"},
  image:{label:"Gambar",icon:"🎨"}
};

/* RIWAYAT CHAT */
try{
  const saved=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");
  if(Array.isArray(saved)){
    history=saved.filter(item=>
      item&&["user","assistant"].includes(item.role)&&typeof item.content==="string"
    ).slice(-40);
  }
}catch{history=[]}

function saveHistory(){
  try{
    const safeHistory=history.slice(-40).map(item=>{
      const copy={role:item.role,content:item.content};
      if(item.attachmentLabel)copy.attachmentLabel=item.attachmentLabel;
      if(item.metadata)copy.metadata=item.metadata;
      return copy;
    });
    localStorage.setItem(HISTORY_KEY,JSON.stringify(safeHistory));
  }catch(error){console.warn("Riwayat tidak dapat disimpan.",error)}
}

function getTime(){
  return new Intl.DateTimeFormat("id-ID",{hour:"2-digit",minute:"2-digit"}).format(new Date());
}
function scrollToBottom(){
  requestAnimationFrame(()=>chatArea.scrollTop=chatArea.scrollHeight);
}

/* FITUR SUARA */
function setVoiceStatus(text,show=true){
  voiceStatus.textContent=text;
  voiceStatus.classList.toggle("show",show&&!!text);
}

function updateMicUI(){
  micButton.classList.toggle("listening",isListening);
  micButton.textContent=isListening?"⏹":"🎙️";
  micButton.setAttribute("aria-label",isListening?"Hentikan rekaman":"Mulai bicara");
  micButton.title=isListening?"Hentikan rekaman":"Bicara";
}

function stopListening(){
  if(recognition){
    try{recognition.stop()}catch{}
  }
  isListening=false;
  updateMicUI();
}

function startListening(){
  if(!speechSupported){
    setVoiceStatus("Browser ini belum mendukung pengenalan suara. Coba Chrome versi terbaru.");
    return;
  }
  if(isSending){
    setVoiceStatus("Tunggu sampai Meet selesai membalas.");
    return;
  }
  if(isListening){
    stopListening();
    setVoiceStatus("Rekaman dihentikan. Periksa teks sebelum mengirim.");
    return;
  }

  if(ttsSupported)window.speechSynthesis.cancel();

  voiceBaseText=input.value.trim();
  recognition=new SpeechRecognition();
  recognition.lang="id-ID";
  recognition.continuous=true;
  recognition.interimResults=true;

  let finalTranscript="";

  recognition.onstart=()=>{
    isListening=true;
    updateMicUI();
    statusText.textContent="Sedang mendengarkan…";
    setVoiceStatus("Silakan bicara. Tekan tombol ⏹ untuk berhenti.");
  };

  recognition.onresult=event=>{
    let interim="";
    for(let i=event.resultIndex;i<event.results.length;i++){
      const transcript=event.results[i][0].transcript;
      if(event.results[i].isFinal)finalTranscript+=transcript+" ";
      else interim+=transcript;
    }

    const transcript=(voiceBaseText?voiceBaseText+" ":"")+
      (finalTranscript+interim).trim();

    input.value=transcript;
    input.style.height="auto";
    input.style.height=Math.min(input.scrollHeight,140)+"px";
  };

  recognition.onerror=event=>{
    const errors={
      "not-allowed":"Izin mikrofon ditolak. Izinkan akses mikrofon di browser.",
      "audio-capture":"Mikrofon tidak ditemukan.",
      "no-speech":"Suara belum terdeteksi. Coba bicara lebih dekat ke mikrofon.",
      "network":"Pengenalan suara mengalami masalah jaringan.",
      "service-not-allowed":"Layanan pengenalan suara tidak diizinkan browser."
    };
    setVoiceStatus(errors[event.error]||("Pengenalan suara gagal: "+event.error));
  };

  recognition.onend=()=>{
    isListening=false;
    updateMicUI();
    statusText.textContent="Lagi online";
    if(input.value.trim())setVoiceStatus("Teks sudah siap. Tekan ↑ untuk mengirim.");
    else if(voiceStatus.textContent.startsWith("Silakan bicara"))setVoiceStatus("",false);
  };

  try{recognition.start()}
  catch(error){
    isListening=false;
    updateMicUI();
    setVoiceStatus("Tidak dapat memulai mikrofon: "+error.message);
  }
}

function speakText(text){
  if(!autoSpeak||!ttsSupported||!text)return;
  const clean=String(text)
    .replace(/https?:\/\/\S+/g,"tautan")
    .replace(/\[GAMBAR\][\s\S]*/g,"")
    .trim();
  if(!clean)return;

  window.speechSynthesis.cancel();
  lastSpokenText=clean;

  const utterance=new SpeechSynthesisUtterance(clean);
  utterance.lang="id-ID";
  utterance.rate=1;
  utterance.pitch=1;
  utterance.volume=1;

  const voices=window.speechSynthesis.getVoices();
  const indonesianVoice=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("id"));
  if(indonesianVoice)utterance.voice=indonesianVoice;

  utterance.onstart=()=>setVoiceStatus("Meet sedang berbicara…");
  utterance.onend=()=>setVoiceStatus("Selesai berbicara.",true);
  utterance.onerror=event=>{
    if(event.error!=="canceled")setVoiceStatus("Suara tidak dapat diputar pada perangkat ini.");
  };

  window.speechSynthesis.speak(utterance);
}

function addSpeechControls(container,text){
  if(!ttsSupported||!text)return;
  const actions=document.createElement("div");
  actions.className="speech-actions";

  const play=document.createElement("button");
  play.type="button";

function safeHttpUrl(value){

}
function addBasisRow(grid,label,value){

function renderBasis(container,metadata){
  const details=document.createElement("details");
  details.className="answer-basis";
  const summary=document.createElement("summary");
  summary.textContent="🔎 Dasar Jawaban";
  details.appendChild(summary);
  const body=document.createElement("div");

  grid.className="basis-grid";
  const meta=metadata&&typeof metadata==="object"?metadata:{};
  const search=meta.search&&typeof meta.search==="object"?meta.search:{};
  const sources=Array.isArray(search.sources)?search.sources:[];
  const mode=meta.mode||"Tidak tersedia";
  const model=meta.model||"Tidak tersedia";
  const context=Number.isFinite(Number(meta.contextMessages))?Number(meta.contextMessages):null;

  addBasisRow(grid,"Mode jawaban",modeInfo[mode]?.label||mode);
  addBasisRow(grid,"Model AI",model);
  addBasisRow(grid,"Pencarian web",!search.attempted?"Tidak dilakukan":search.succeeded?"Berhasil":"Dicoba, tetapi tidak berhasil");
  addBasisRow(grid,"Hasil pencarian",(Number(search.resultsCount)||sources.length)+" hasil");
  addBasisRow(grid,"Konteks sebelumnya",context===null?"Tidak dilaporkan":context+" pesan");
  addBasisRow(grid,"Lampiran",meta.fileUsed===true?"Teks lampiran terdeteksi dikirim":"Tidak terdeteksi");
  body.appendChild(grid);

  if(sources.length){
    const heading=document.createElement("div");
    heading.className="basis-heading";
    heading.textContent="Sumber web yang dilaporkan Worker";
    body.appendChild(heading);
    const list=document.createElement("ol");

    let rendered=0;

    for(const source of sources){
      if(rendered>=20)break;
      const url=safeHttpUrl(typeof source==="string"?source:source?.url||source?.link||source?.href||"");
      if(!url)continue;
      const li=document.createElement("li");
      const a=document.createElement("a");
      a.href=url;a.target="_blank";a.rel="noopener noreferrer";
      a.textContent=String(typeof source==="object"?source.title||source.name||url:url);
      li.appendChild(a);
      if(typeof source==="object"&&source.snippet){
        const snippet=document.createElement("div");
        snippet.textContent=String(source.snippet).slice(0,400);

      }
      list.appendChild(li);rendered++;
    }
    if(rendered)body.appendChild(list);

    noSources.textContent="Tidak ada tautan sumber yang dilaporkan untuk jawaban ini.";
    body.appendChild(noSources);
  }

  const note=document.createElement("div");
  note.className="basis-note";
  note.textContent="Panel ini menampilkan metadata dari Worker. Status lampiran bukan bukti bahwa seluruh isi file dipahami model.";
  body.appendChild(note);
  details.appendChild(body);
  container.appendChild(details);
}

/* MEMORI */
function detectMemoryCommand(text){
  const value=String(text||"").trim();
  if(!value)return false;
  const patterns=[
    /^\s*(?:tolong\s+)?(?:kamu\s+)?(?:inget|ingat)\s+(?:ini|ya|baik-baik|baik baik)\b/i,
    /^\s*(?:tolong\s+)?(?:kamu\s+)?(?:inget|ingat)\s+(?:ya\s*,?\s*)?(?:bahwa|kalau|kalo)\b/i,
    /^\s*(?:tolong\s+)?(?:kamu\s+)?simpan\s+(?:ya|ini|baik-baik|baik baik)\b/i,
    /^\s*(?:tolong\s+)?(?:kamu\s+)?catat\s+(?:ya|ini|bahwa|kalau|kalo)\b/i,
    /^\s*(?:tolong\s+)?jangan\s+lupa\b/i,
    /^\s*(?:masukkan|masukin)\s+(?:ke\s+)?memori\b/i
  ];
  return patterns.some(pattern=>pattern.test(value));
}
function getMemoryInstruction(text){
  return[
    "[PERMINTAAN MEMORI EKSPLISIT]",
    "Pengguna meminta informasi dalam pesan ini untuk diingat.",

    "Gunakan penyimpanan memori yang tersedia di backend. Jangan mengaku menyimpan jika belum berhasil.",
    "Pesan pengguna:",text
  ].join("\n");
}
function getModePrefix(mode){
  switch(mode){
    case"short":return"[MODE JAWABAN SINGKAT: jawab ringkas dan langsung.]\n";
    case"think":return"[MODE BERPIKIR: analisis dengan cermat dan berikan kesimpulan tanpa menampilkan penalaran internal.]\n";
    case"search":return"[MODE BROWSING: cari informasi web yang relevan dan sertakan sumber yang benar-benar digunakan.]\n";
    case"think_search":return"[MODE BERPIKIR + BROWSING: cari informasi web, evaluasi hasilnya, dan berikan kesimpulan dengan sumber.]\n";
    case"memory":return"[MODE MEMORI: prioritaskan pencarian memori yang tersedia. Jangan mengarang memori.]\n";
    default:return"";
  }
}

async function runOCR(source,label="gambar"){
  if(!window.Tesseract)throw Error("Library OCR gagal dimuat. Periksa koneksi internet.");
  fileHint.hidden=false;
  const result=await Tesseract.recognize(source,"ind+eng",{
    logger:info=>{
      if(info.status==="recognizing text")fileHint.textContent="Membaca "+label+": "+Math.round((info.progress||0)*100)+"%";
      else if(info.status)fileHint.textContent="Memproses "+label+": "+info.status+"...";
    }
  });
  return(result.data.text||"").trim();
}
async function readPDFWithOCR(file){
  if(!window.pdfjsLib)throw Error("Library PDF gagal dimuat. Periksa koneksi internet.");
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const limit=Math.min(pdf.numPages,10);const parts=[];
  for(let pageNumber=1;pageNumber<=limit;pageNumber++){
    fileHint.textContent="Memproses halaman PDF "+pageNumber+" dari "+limit+"...";
    const page=await pdf.getPage(pageNumber);
    const content=await page.getTextContent();
    const text=content.items.map(item=>item.str||"").join(" ").trim();
    if(text.length>30){parts.push("[Halaman "+pageNumber+"]\n"+text);continue}
    const viewport=page.getViewport({scale:1.5});
    const canvas=document.createElement("canvas");
    const context=canvas.getContext("2d");
    if(!context)throw Error("Browser tidak dapat memproses halaman PDF.");
    canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
    await page.render({canvasContext:context,viewport}).promise;
    try{
      const ocr=await runOCR(canvas,"halaman "+pageNumber);
      parts.push("[Halaman "+pageNumber+"]\n"+(ocr||"(Tidak ada teks yang berhasil dikenali.)"));
    }finally{canvas.width=0;canvas.height=0}
  }
  if(pdf.numPages>limit)parts.push("Catatan: hanya "+limit+" dari "+pdf.numPages+" halaman yang diproses.");
  return parts.join("\n\n").slice(0,MAX_TEXT_LENGTH);
}

});

/* DETEKSI PERMINTAAN GAMBAR */
function isImageRequest(text){
  const value=String(text||"").toLowerCase().trim();
  if(!value)return false;
  const patterns=[
    /\bbuatkan\s+(gambar|image|ilustrasi|foto)\b/i,
    /\bbuat\s+(gambar|image|ilustrasi|foto)\b/i,
    /\bbikinin\s+(gambar|image|ilustrasi|foto)\b/i,
    /\bbikin\s+(gambar|image|ilustrasi|foto)\b/i,
    /\bgambarkan\b/i,/\bgambarin\b/i,
    /\bgenerate\s+(gambar|image)\b/i,
    /\bbuatkan.*gambar\b/i,/\bbuat.*gambar\b/i,/\bbikin.*gambar\b/i,
    /\bgenerate.*image\b/i,/\bcreate.*image\b/i,/\bdraw.*image\b/i,
    /\bbuatkan.*ilustrasi\b/i,/\bbuat.*ilustrasi\b/i
  ];
  return patterns.some(pattern=>pattern.test(value));
}
function extractImagePrompt(text){
  let prompt=String(text||"").trim();
  prompt=prompt.replace(/^\s*(tolong\s+)?/i,"").replace(/^\s*(dong|ya|please)\s*/i,"").trim();
  prompt=prompt.replace(/^(buatkan|buat|bikinin|bikin|generate|create|draw)\s+(gambar|image|ilustrasi|foto)\s*/i,"").trim();
  return prompt||String(text||"").trim()||"Buat gambar berdasarkan permintaan pengguna.";
}

/* GENERATE IMAGE */
async function generateImageFromChat(prompt){
  const response=await fetch(IMAGE_API_URL,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt,imagePrompt:prompt,characterName:"Meet",gender:""})
  });
  const contentType=(response.headers.get("content-type")||"").toLowerCase();
  if(!response.ok){
    let detail="Gagal membuat gambar ("+response.status+").";
    if(contentType.includes("application/json")){
      try{const data=await response.json();detail=data?.error||data?.message||detail}catch{}
    }else{const text=await response.text();if(text)detail=text.slice(0,500)}
    throw Error(detail);
  }
  if(!contentType.startsWith("image/")){
    if(contentType.includes("application/json")){
      let data={};try{data=await response.json()}catch{}
      throw Error(data?.error||"Worker belum mengembalikan file gambar.");
    }
    throw Error("Respons Worker bukan file gambar. Content-Type: "+(contentType||"tidak diketahui"));
  }
  const blob=await response.blob();
  if(!blob.size)throw Error("Worker mengembalikan file gambar kosong.");
  const url=URL.createObjectURL(blob);generatedMediaUrls.push(url);return url;
}

/* CHAT BIASA */
async function sendMessage(raw){
  const text=String(raw||"").trim();
  if((!text&&!selectedFile)||isSending)return;
  if(selectedFile&&isReadingFile){fileHint.hidden=false;fileHint.textContent="Tunggu sampai pembacaan file selesai.";return}
  if(selectedFile&&!fileText.trim()){fileHint.hidden=false;fileHint.textContent="File belum berhasil dibaca. Pilih file lain atau unggah ulang.";return}

  const attachment=selectedFile;
  const mode=activeMode||"auto";
  const explicitMemoryCommand=detectMemoryCommand(text);
  const wantsImage=mode==="image"||isImageRequest(text);
  if(wantsImage&&!attachment){await generateMedia("image",text);return}

  isSending=true;sendButton.disabled=true;micButton.disabled=true;input.disabled=true;
  statusText.textContent="Sedang memproses…";
  addMessage("user",text||(attachment?"Aku mengirim file.":""),attachment?.name||"");

  let content=getModePrefix(mode)+(text||(attachment?"Tolong baca dan jelaskan isi file yang aku lampirkan.":""));
  if(explicitMemoryCommand)content=getModePrefix(mode)+getMemoryInstruction(text);
  if(attachment)content+="\n[File dilampirkan: "+attachment.name+"]\nISI FILE:\n"+fileText;

  history.push({role:"user",content,attachmentLabel:attachment?.name||""});
  history=history.slice(-40);saveHistory();

  showTyping(
    mode==="search"||mode==="think_search"?"Meet sedang browsing":
    mode==="think"?"Meet sedang menganalisis":
    mode==="memory"?"Meet sedang mencari memori":
    explicitMemoryCommand?"Meet sedang menyimpan memori":"Meet sedang mengetik"
  );

  try{
    const response=await fetch(API_URL,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        session_id:sessionId,mode,memory_command:explicitMemoryCommand,
        messages:history.slice(-12).map(item=>({role:item.role,content:item.content}))
      })
    });
    let data;
    try{data=await response.json()}catch{throw Error("Worker mengirim respons yang bukan JSON.")}
    if(!response.ok)throw Error(data?.error||"Permintaan gagal ("+response.status+").");
    const reply=data?.reply||data?.response||data?.result?.response||data?.result?.choices?.[0]?.message?.content;
    if(typeof reply!=="string"||!reply.trim())throw Error(data?.error||"Balasan AI kosong.");

    const cleanReply=reply.trim();
    const metadata=data?.metadata&&typeof data.metadata==="object"?data.metadata:null;
    removeTyping();
    history.push({role:"assistant",content:cleanReply,metadata});
    history=history.slice(-40);
    addMessage("assistant",cleanReply,"",metadata);
    saveHistory();clearSelectedFile();
    speakText(cleanReply);
  }catch(error){
    removeTyping();
    const row=addMessage("assistant","Aku lagi susah memproses pesan itu 😅 Coba lagi sebentar, ya.");
    const note=document.createElement("div");note.className="error-note";note.textContent=error.message||"Koneksi gagal.";
    row.querySelector(".bubble").appendChild(note);
    console.error("Meet error:",error);
  }finally{
    isSending=false;sendButton.disabled=false;micButton.disabled=false;input.disabled=false;
    statusText.textContent="Lagi online";input.focus();scrollToBottom();
  }
}
